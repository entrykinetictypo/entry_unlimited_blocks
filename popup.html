<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Entry Unlimited Blocks</title>

  <style>
    body {
      width: 260px;
      margin: 0;
      padding: 24px;
      font-family: Arial, sans-serif;
      text-align: center;
      background: white;
    }

    h2 {
      margin: 0 0 18px;
      font-size: 20px;
    }

    #status {
      margin-bottom: 18px;
      font-size: 15px;
    }

    #toggle {
      border: none;
      border-radius: 12px;
      padding: 11px 22px;
      font-size: 14px;
      cursor: pointer;
      background: #eeeeee;
    }

    #toggle:hover {
      background: #dddddd;
    }
  </style>
</head>

<body>
  <h2>블록 연결 제한 해제</h2>

  <div id="status">상태 확인 중...</div>

  <button id="toggle">불러오는 중...</button>
  <hr style="margin:20px 0;">

<h2>블록 불러오기</h2>

<input
  id="blockId"
  type="text"
  placeholder="예: when_run_button_click"
  style="
    width: 220px;
    box-sizing: border-box;
    padding: 9px 10px;
    border: 1px solid #ccc;
    border-radius: 8px;
    margin-bottom: 10px;
  "
>

<button id="addBlock">블록 추가</button>

<div
  id="addResult"
  style="
    margin-top: 10px;
    font-size: 13px;
  "
></div>

<hr style="margin:20px 0;">

<h2>최근 추가한 블록</h2>

<div id="recentBlocks"></div>

<hr style="margin:20px 0;">

<h2>비공식 블록</h2>

<div id="unofficialBlocks"></div>

<p style="font-size:12px; color:#666;">
작품을 저장한 뒤 클릭하세요.
</p>

<button id="unloadUnofficial">비공식 블록 전체 해제</button>

<hr style="margin:20px 0;">

<h2>콘솔 기능</h2>

<button id="unbanBlocks">하드웨어,인공지능,더미데이터 등 불러오기</button>

<p style="font-size:12px; color:#666; margin-top:6px;">
하드웨어 블록은 2분 이상 걸릴 수 있으니 기다려 주세요.
</p>

<h3>초시계 설정</h3>

<input id="timerName" type="text" placeholder="초시계 이름">

<input id="timerX" type="number" placeholder="X 좌표">

<input id="timerY" type="number" placeholder="Y 좌표">

<button id="applyTimer">초시계 적용</button>

<button id="showTimer">초시계 보이기</button>

<button id="hideTimer">초시계 숨기기</button>

<h3>함수 편집</h3>

<input id="localVariableCount" type="number" value="1" min="1" placeholder="개수">

<button id="addLocalVariable">지역변수 추가</button>

<h3>프레임 속도</h3>

<input id="frameSpeed" type="number" placeholder="예: 120">

<button id="applyFrameSpeed">프레임 속도 적용</button>

  <script src="popup.js"></script>
</body>
</html>
