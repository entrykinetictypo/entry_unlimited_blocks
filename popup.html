<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Entry Unlimited Blocks</title>

  <style>
    body {
      width: 260px;
      margin: 0;
      padding: 24px;
      font-family: Arial, sans-serif;
      text-align: center;
      background: white;
    }

    h2 {
      margin: 0 0 18px;
      font-size: 20px;
    }

    #status {
      margin-bottom: 18px;
      font-size: 15px;
    }

    #toggle {
      border: none;
      border-radius: 12px;
      padding: 11px 22px;
      font-size: 14px;
      cursor: pointer;
      background: #eeeeee;
    }

    #toggle:hover {
      background: #dddddd;
    }
  </style>
</head>

<body>
  <h2>블록 연결 제한 해제</h2>

  <div id="status">상태 확인 중...</div>

  <button id="toggle">불러오는 중...</button>
  <hr style="margin:20px 0;">

<h2>블록 불러오기</h2>

<input
  id="blockId"
  type="text"
  placeholder="예: when_run_button_click"
  style="
    width: 220px;
    box-sizing: border-box;
    padding: 9px 10px;
    border: 1px solid #ccc;
    border-radius: 8px;
    margin-bottom: 10px;
  "
>

<button id="addBlock">블록 추가</button>

<div
  id="addResult"
  style="
    margin-top: 10px;
    font-size: 13px;
  "
></div>

<hr style="margin:20px 0;">

<h2>최근 추가한 블록</h2>

<div id="recentBlocks"></div>

<hr style="margin:20px 0;">

<h2>비공식 블록</h2>

<div id="unofficialBlocks"></div>

<button id="unloadUnofficial">비공식 블록 전체 해제</button>

  <script src="popup.js"></script>
</body>
</html>
