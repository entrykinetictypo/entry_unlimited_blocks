<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Entry Unlimited Blocks</title>

  <style>
    body {
      width: 260px;
      margin: 0;
      padding: 24px;
      font-family: Arial, sans-serif;
      text-align: center;
      background: white;
    }

    h2 {
      margin: 0 0 18px;
      font-size: 20px;
    }

    #status {
      margin-bottom: 18px;
      font-size: 15px;
    }

    #toggle {
      border: none;
      border-radius: 12px;
      padding: 11px 22px;
      font-size: 14px;
      cursor: pointer;
      background: #eeeeee;
    }

    #toggle:hover {
      background: #dddddd;
    }
  </style>
</head>

<body>
  <h2>블록 연결 제한 해제</h2>

  <div id="status">상태 확인 중...</div>

  <button id="toggle">불러오는 중...</button>

  <script src="popup.js"></script>
</body>
</html>
